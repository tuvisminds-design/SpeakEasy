<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakeasy & HR Agent Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .service-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .service-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.running {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.stopped {
            background: #ef4444;
            animation: none;
        }

        .status-indicator.starting {
            background: #f59e0b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .status-message {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-refresh {
            background: #f3f4f6;
            color: #333;
            border: 2px solid #e5e7eb;
            width: 100%;
            margin-top: 15px;
        }

        .btn-refresh:hover:not(:disabled) {
            background: #e5e7eb;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .icon {
            width: 16px;
            height: 16px;
        }

        .log-container {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #10b981;
            margin-top: 10px;
            display: none;
        }

        .log-container.show {
            display: block;
        }

        .log-line {
            margin-bottom: 2px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎛️ Service Controller</h1>
            <p>Manage SpeakEasy & HR Agent Services</p>
        </div>

        <!-- SpeakEasy Service -->
        <div class="service-card" id="speakeasy-card">
            <div class="service-header">
                <div class="service-title">🎤 SpeakEasy</div>
                <div class="status-text">
                    <span class="status-indicator" id="speakeasy-indicator"></span>
                    <span id="speakeasy-status">Checking...</span>
                </div>
            </div>
            <div class="status-message" id="speakeasy-message">Please wait...</div>
            <div class="button-group">
                <button class="btn btn-start" id="speakeasy-start" data-service="speakeasy">Start</button>
                <button class="btn btn-stop" id="speakeasy-stop" data-service="speakeasy" disabled>Stop</button>
            </div>
            <div class="log-container" id="speakeasy-logs"></div>
        </div>

        <!-- HR Backend Service -->
        <div class="service-card" id="hr-backend-card">
            <div class="service-header">
                <div class="service-title">⚙️ HR Backend</div>
                <div class="status-text">
                    <span class="status-indicator" id="hr-backend-indicator"></span>
                    <span id="hr-backend-status">Checking...</span>
                </div>
            </div>
            <div class="status-message" id="hr-backend-message">Please wait...</div>
            <div class="button-group">
                <button class="btn btn-start" id="hr-backend-start" data-service="hr-backend">Start</button>
                <button class="btn btn-stop" id="hr-backend-stop" data-service="hr-backend" disabled>Stop</button>
            </div>
            <div class="log-container" id="hr-backend-logs"></div>
        </div>

        <!-- HR Frontend Service -->
        <div class="service-card" id="hr-frontend-card">
            <div class="service-header">
                <div class="service-title">💼 HR Frontend</div>
                <div class="status-text">
                    <span class="status-indicator" id="hr-frontend-indicator"></span>
                    <span id="hr-frontend-status">Checking...</span>
                </div>
            </div>
            <div class="status-message" id="hr-frontend-message">Please wait...</div>
            <div class="button-group">
                <button class="btn btn-start" id="hr-frontend-start" data-service="hr-frontend">Start</button>
                <button class="btn btn-stop" id="hr-frontend-stop" data-service="hr-frontend" disabled>Stop</button>
            </div>
            <div class="log-container" id="hr-frontend-logs"></div>
        </div>

        <button class="btn btn-refresh" id="refreshBtn">
            🔄 Refresh All Status
        </button>

        <div class="footer">
            <a href="http://localhost:3000" target="_blank" id="speakeasy-link" style="display: none;">SpeakEasy →</a>
            <a href="http://localhost:5000" target="_blank" id="hr-backend-link" style="display: none;">HR API →</a>
            <a href="http://localhost:3001" target="_blank" id="hr-frontend-link" style="display: none;">HR App →</a>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const services = ['speakeasy', 'hr-backend', 'hr-frontend'];
        const serviceStatus = {};

        services.forEach(service => {
            serviceStatus[service] = 'unknown';
        });

        function updateServiceStatus(service, status, message) {
            serviceStatus[service] = status;
            const indicator = document.getElementById(`${service}-indicator`);
            const statusText = document.getElementById(`${service}-status`);
            const statusMessage = document.getElementById(`${service}-message`);
            const startBtn = document.getElementById(`${service}-start`);
            const stopBtn = document.getElementById(`${service}-stop`);
            const link = document.getElementById(`${service}-link`);

            indicator.className = `status-indicator ${status}`;
            
            switch(status) {
                case 'running':
                    statusText.textContent = 'Running';
                    statusMessage.textContent = message || `${service} is running`;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    if (link) link.style.display = 'inline';
                    break;
                case 'stopped':
                    statusText.textContent = 'Stopped';
                    statusMessage.textContent = message || `${service} is not running`;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    if (link) link.style.display = 'none';
                    break;
                case 'starting':
                    statusText.textContent = 'Starting...';
                    statusMessage.textContent = message || `Starting ${service}...`;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    if (link) link.style.display = 'none';
                    break;
            }
        }

        // IPC listeners
        ipcRenderer.on('status-update', (event, data) => {
            updateServiceStatus(data.service, data.status, data.message);
        });

        ipcRenderer.on('log-output', (event, data) => {
            const logContainer = document.getElementById(`${data.service}-logs`);
            if (logContainer) {
                logContainer.classList.add('show');
                const logLine = document.createElement('div');
                logLine.className = 'log-line';
                logLine.textContent = data.output.trim();
                logContainer.appendChild(logLine);
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        });

        // Button handlers
        services.forEach(service => {
            const startBtn = document.getElementById(`${service}-start`);
            const stopBtn = document.getElementById(`${service}-stop`);

            startBtn.addEventListener('click', () => {
                ipcRenderer.send('start-app', service);
                updateServiceStatus(service, 'starting', `Starting ${service}...`);
                const logContainer = document.getElementById(`${service}-logs`);
                if (logContainer) {
                    logContainer.innerHTML = '<div class="log-line">Starting...</div>';
                    logContainer.classList.add('show');
                }
            });

            stopBtn.addEventListener('click', () => {
                ipcRenderer.send('stop-app', service);
                updateServiceStatus(service, 'stopped', `Stopping ${service}...`);
            });
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            ipcRenderer.send('check-status');
        });

        // Initial status check
        ipcRenderer.send('check-status');
    </script>
</body>
</html>
